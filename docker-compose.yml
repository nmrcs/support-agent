services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
      POSTGRES_DB: support_agent
    ports:
      # 5433 on the host so it can run next to another local Postgres.
      - '5433:5432'
    volumes:
      # 18+ keeps PGDATA under /var/lib/postgresql/<major>; mount the parent.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U support -d support_agent']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
